name: OkamiUNI
options:
  bundleIdPrefix: com.okamiops
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  UNIDesign:
    path: Packages/UNIDesign
  UNICore:
    path: Packages/UNICore
  UNIShell:
    path: Packages/UNIShell
  UNISync:
    path: Packages/UNISync

configFiles:
  Debug: Config/Google.xcconfig
  Release: Config/Google.xcconfig

targets:
  OkamiUNI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Fonts"
      - path: App/Resources/Fonts
        type: folder
      # Os dois roteiros que a janela de Contas abre ("Ver o roteiro" e "O que
      # é uma senha de app?"). Vão **dentro do app**, e não como link para o
      # GitHub: link depende de branch, de rede e de o arquivo não ter sido
      # renomeado — três formas de o botão virar um 404. Embarcados, ele abre
      # offline e sempre na versão que o app conhece.
      - path: docs/oauth-google.md
        buildPhase: resources
      - path: docs/senha-de-app.md
        buildPhase: resources
    dependencies:
      - package: UNIDesign
        product: UNIDesign
      - package: UNICore
        product: UNICore
      - package: UNIShell
        product: UNIShell
      - package: UNISync
        product: UNISync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okamiops.okamiuni
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/OkamiUNI.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
